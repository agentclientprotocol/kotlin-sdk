name: Rust Agent E2E
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-agent-e2e:
    name: rust-agent-e2e (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        client: [client-v1, client-v2]

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # tag: v4

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # tag: v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # tag: v2

      - name: Cache Rust SDK checkout and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # tag: v4
        with:
          path: e2e/rust-agent/.sut
          key: rust-agent-${{ matrix.client }}-${{ hashFiles('e2e/rust-agent/rust-sdk.rev', 'e2e/rust-agent/rust-toolchain.toml', 'e2e/rust-agent/setup_sut.sh') }}

      - name: Run Rust agent e2e tests
        run: ./gradlew :e2e:rust-agent:${{ matrix.client }}:e2eTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag: v7.0.2
        with:
          name: rust-agent-e2e-${{ matrix.client }}
          path: |
            e2e/rust-agent/${{ matrix.client }}/build/reports/tests/e2eTest
            e2e/rust-agent/${{ matrix.client }}/build/test-results/e2eTest
            e2e/rust-agent/${{ matrix.client }}/build/e2e-logs
          if-no-files-found: warn
