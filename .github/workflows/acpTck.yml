name: ACP TCK
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acp-tck:
    name: acp-tck (v${{ matrix.protocol }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        protocol: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # tag: v4

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # tag: v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # tag: v2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # tag: v10.3.0

      - name: Build TCK agent
        run: ./gradlew :e2e:tck:agent-v${{ matrix.protocol }}:installDist

      - name: Run ACP TCK
        # TODO Informational until the requirements the SDK currently fails are triaged; the report is the result.
        continue-on-error: true
        run: ./e2e/tck/run.sh ${{ matrix.protocol }} --report-json reports/v${{ matrix.protocol }}.json

      - name: Upload TCK report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag: v7.0.2
        with:
          name: acp-tck-report-v${{ matrix.protocol }}
          path: e2e/tck/reports/v${{ matrix.protocol }}.json
          if-no-files-found: warn
